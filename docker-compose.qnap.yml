# Da incollare in Container Station → Applicazioni → Crea.
# Sostituisci i valori tra < > prima di creare l'applicazione.
services:
  studio:
    image: ghcr.io/innocentiniccolo-blip/prova:latest
    container_name: studio-tecnico
    restart: unless-stopped
    user: "<PUID>:<PGID>"
    ports:
      - "3000:3000"
    environment:
      SESSION_SECRET: "<stringa casuale lunga>"
      COOKIE_SECURE: "false"
      TRUST_PROXY: "false"
      SOLO_AREA: "true"
      URL_PUBBLICO: "https://area.geometrainnocenti.it"
      SMTP_HOST: "smtps.aruba.it"
      SMTP_PORT: "465"
      SMTP_USER: "info@geometrainnocenti.it"
      SMTP_PASS: "<password della casella info@geometrainnocenti.it>"
      MAIL_FROM: "info@geometrainnocenti.it"
    volumes:
      - /share/Lavori:/archivio
      - /share/Container/studio-tecnico:/dati
